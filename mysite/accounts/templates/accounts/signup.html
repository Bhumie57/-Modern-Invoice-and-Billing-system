{% extends "base.html" %}

{% block content %}

<h1>Create Account</h1>

<form method="POST">
    {% csrf_token %}

    {{ form.username.label }}
    {{ form.username }}

    <br><br>

    {{ form.email.label }}
    {{ form.email }}

    <br><br>

    {{ form.password1.label }}
    {{ form.password1 }}

    <br><br>

    {{ form.password2.label }}
    {{ form.password2 }}

    <br><br>

    <button type="submit">Sign Up</button>
</form>

{% endblock %}
